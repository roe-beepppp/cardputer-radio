; CardRadio — web radio (WiFi + radio.txt) para M5Stack Cardputer ADV
; App standalone para o M5Launcher (bmorcelli). App irmao: CardPlayer.
[platformio]
default_envs = radio

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
lib_ldf_mode = deep+
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM=0
    -DARDUINO_LOOP_STACK_SIZE=16384
    -I $PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/Network/src
    -I $PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/FS/src
    -I $PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/WiFi/src
custom_sdkconfig =
    CONFIG_LWIP_MAX_SOCKETS=6
    CONFIG_LWIP_TCP_SND_BUF_DEFAULT=2920
    CONFIG_LWIP_TCP_WND_DEFAULT=2920
    CONFIG_LWIP_TCP_RECVMBOX_SIZE=6
    CONFIG_LWIP_UDP_RECVMBOX_SIZE=4
    CONFIG_LWIP_TCPIP_RECVMBOX_SIZE=16
    CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM=4
    CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM=12
    CONFIG_ESP_WIFI_STATIC_TX_BUFFER_NUM=4
    CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM=12
    CONFIG_ESP_WIFI_AMPDU_RX_ENABLED=n
    CONFIG_ESP_WIFI_AMPDU_TX_ENABLED=n
    CONFIG_ESP_WIFI_ENTERPRISE_SUPPORT=n
lib_deps =
    m5stack/M5Unified@0.2.26
    https://github.com/m5stack/M5Cardputer.git#1.2.0
    ; ESP32-audioI2S 3.0.12 vendored em lib/ (patches: ver MEMORY.md §5)

[env:radio]
build_flags = ${env.build_flags}
    -DCM_APP_RADIO
